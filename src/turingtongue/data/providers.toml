# Provider registry — the single place for frequently changing provider facts.
# Every fact must be re-verified against official documentation; see docs/providers.md.
# Fields: see turingtongue.registry.ProviderSpec. Sizes are in `limit_unit`.

[providers.mock]
name = "Mock (offline)"
transport = "mock"
adapter = "turingtongue.providers.mock:MockProvider"
requires_credentials = false
credential_env = []
enabled_by_default = false
supports_segments = false
supports_mixed_label = true
supports_model_version = true
limit_unit = "characters"
known_languages = "any (no analysis performed)"
adapter_status = "test double — NOT a detector; returns a fixed configured answer"
last_verified = "2026-10-07"
docs_url = ""
notes = "Offline smoke-test provider. Answer chosen by TURINGTONGUE_MOCK_RESULT (human|ai|mixed|error)."

[providers.sapling]
name = "Sapling"
transport = "api"
adapter = "turingtongue.providers.sapling:SaplingProvider"
credential_env = ["SAPLING_API_KEY"]
enabled_by_default = true
supports_segments = true
supports_mixed_label = false
supports_model_version = true
known_max_input = 200000
recommended_min_input = 300
limit_unit = "characters"
known_languages = "English only (provider claim)"
adapter_status = "implemented; contract-tested against documented examples; not yet run live"
last_verified = "2026-10-07"
docs_url = "https://sapling.ai/docs/api/detector/"
endpoint = "POST https://api.sapling.ai/api/v1/aidetect"
notes = "Free trial key returns real results (50k chars/day, 250k/month at verification)."

[providers.gptzero]
name = "GPTZero"
transport = "api"
adapter = "turingtongue.providers.gptzero:GPTZeroProvider"
credential_env = ["GPTZERO_API_KEY"]
enabled_by_default = true
supports_segments = true
supports_mixed_label = true
supports_model_version = true
known_max_input = 50000
limit_unit = "characters"
known_languages = "English; French and Spanish with multilingual=true (provider claim)"
adapter_status = "implemented; contract-tested against documented examples; not yet run live"
last_verified = "2026-10-07"
docs_url = "https://gptzero.stoplight.io/docs/gptzero-api"
endpoint = "POST https://api.gptzero.me/v2/predict/text"
notes = "Provider silently truncates at 50,000 characters; we submit an exact prefix and mark it."

[providers.pangram]
name = "Pangram"
transport = "api"
adapter = "turingtongue.providers.pangram:PangramProvider"
credential_env = ["PANGRAM_API_KEY"]
enabled_by_default = true
supports_segments = true
supports_mixed_label = true
supports_model_version = true
limit_unit = "characters"
known_languages = "24 languages listed by the provider"
adapter_status = "implemented; contract-tested against documented examples; not yet run live"
last_verified = "2026-10-07"
docs_url = "https://docs.pangram.com"
endpoint = "POST https://text.external-api.pangram.com/task + GET /task/{id}"
notes = "Async submit+poll. No documented size limit; text sent in full. $0.05 per 100 words at verification."

[providers.copyleaks]
name = "Copyleaks"
transport = "api"
adapter = "turingtongue.providers.copyleaks:CopyleaksProvider"
credential_env = ["COPYLEAKS_EMAIL", "COPYLEAKS_API_KEY"]
enabled_by_default = true
supports_segments = true
supports_mixed_label = false
supports_model_version = true
known_min_input = 255
known_max_input = 100000
limit_unit = "characters"
known_languages = "30 languages, auto-detected (provider claim)"
adapter_status = "implemented; contract-tested against documented examples; not yet run live"
last_verified = "2026-10-07"
docs_url = "https://docs.copyleaks.com/reference/actions/writer-detector/check/"
endpoint = "POST https://api.copyleaks.com/v2/writer-detector/{scanId}/check"
notes = "COPYLEAKS_SANDBOX=1 returns MOCK classifications (excluded from the ensemble). Privacy policy permits training use."

[providers.winston]
name = "Winston AI"
transport = "api"
adapter = "turingtongue.providers.winston:WinstonProvider"
credential_env = ["WINSTON_AI_API_KEY|WINSTON_API_KEY"]
enabled_by_default = true
supports_segments = true
supports_mixed_label = false
supports_model_version = true
known_min_input = 300
recommended_min_input = 600
known_max_input = 150000
limit_unit = "characters"
known_languages = "en, fr, es, pt, nl, de, pl, it, ro, id, tl, ru, bg, zh (provider claim)"
adapter_status = "implemented; contract-tested against documented schema (no official example); not yet run live"
last_verified = "2026-10-07"
docs_url = "https://docs.gowinston.ai"
endpoint = "POST https://api.gowinston.ai/v2/ai-content-detection"
notes = "Score is a HUMAN score (inverted). 1 credit per word; 2,000 free credits on signup at verification."

[providers.originality]
name = "Originality.ai"
transport = "api"
adapter = "turingtongue.providers.originality:OriginalityProvider"
credential_env = ["ORIGINALITY_API_KEY"]
enabled_by_default = true
supports_segments = true
supports_mixed_label = false
supports_model_version = true
limit_unit = "characters"
known_languages = "multilang model, ~30 languages (provider claim)"
adapter_status = "implemented; contract-tested against documented examples; not yet run live"
last_verified = "2026-10-07"
docs_url = "https://docs.originality.ai"
endpoint = "POST https://api.originality.ai/api/v3/scan"
notes = "Enterprise plan only. Accounts auto top-up credits by default. storeScan=false is sent."

[providers.hive]
name = "Hive"
transport = "api"
adapter = "turingtongue.providers.hive:HiveProvider"
credential_env = ["HIVE_API_KEY"]
enabled_by_default = true
supports_segments = true
supports_mixed_label = false
supports_model_version = true
limit_unit = "characters"
known_languages = "not documented"
adapter_status = "implemented; contract-tested against documented examples (two envelope shapes); not yet run live"
last_verified = "2026-10-07"
docs_url = "https://docs.thehive.ai/docs/ai-generated-text-detection"
endpoint = "POST https://api.thehive.ai/api/v2/task/sync (form field text_data)"
notes = "Needs a sales-provisioned V2 project with the AI text model. Provider chunks text into 2,048 chars."

[providers.zerogpt]
name = "ZeroGPT"
transport = "api"
adapter = "turingtongue.providers.zerogpt:ZeroGPTProvider"
credential_env = ["ZEROGPT_API_KEY"]
enabled_by_default = false
supports_segments = true
supports_mixed_label = false
supports_model_version = false
limit_unit = "characters"
known_languages = "not documented"
adapter_status = "implemented from thin docs (no official example response); opt-in until verified live"
last_verified = "2026-10-07"
docs_url = "https://api.zerogpt.com/docs"
endpoint = "POST https://api.zerogpt.com/api/detect/detectText"
notes = "Disabled by default: response schema documented without examples; auth may additionally need a JWT."
