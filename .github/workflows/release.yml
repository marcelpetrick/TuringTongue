# Release pipeline following the PyPA guide "Publishing package distribution releases
# using GitHub Actions" (https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/):
#
#   protected tag vX.Y.Z -> full quality gate -> build once -> signed build provenance
#   -> live E2E against configured services (when vars.E2E_PROVIDERS is set; must pass;
#      otherwise this job is skipped and does not gate the release)
#   -> GitHub Release -> [owner approval in the `pypi` environment] -> PyPI via
#   Trusted Publishing (OIDC; no stored token; PEP 740 attestations are generated).
#
# Hardening outside this file (repository settings, see docs/releasing.md):
#   - ruleset "protect-release-tags": only admins may create/move/delete v* tags
#   - environment `pypi`: required reviewer (owner) and deployments from v* tags only
#
# One-time owner setup before the first upload:
#   1. PyPI -> Your account -> Publishing -> add a *pending* GitHub publisher:
#      project turingtongue, owner marcelpetrick, repo TuringTongue,
#      workflow release.yml, environment pypi
#   2. gh variable set PYPI_PUBLISH --body true
# Until PYPI_PUBLISH is "true" the PyPI job is skipped, so releases stay green.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.4.0"
        required: true
        type: string
      publish_pypi:
        description: "Publish to PyPI (also requires repository variable PYPI_PUBLISH=true)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Quality gate and artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "tag=${INPUT_TAG:-${GITHUB_REF_NAME}}" >> "$GITHUB_OUTPUT"

      - name: Check out tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up uv + Python 3.14
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Tag must match package version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
          if [[ "${TAG}" != "v${version}" ]]; then
            echo "tag ${TAG} does not match pyproject version ${version}" >&2
            exit 1
          fi

      - name: Full local pipeline
        run: ./localPipeline.sh

      - name: Signed build provenance for the distributions
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  live-e2e:
    name: Live E2E against configured provider services
    needs: build
    if: vars.E2E_PROVIDERS != ''
    uses: ./.github/workflows/live-e2e.yml
    secrets: inherit

  github-release:
    name: GitHub Release
    needs: [build, live-e2e]
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.live-e2e.result == 'success' || needs.live-e2e.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* --title "TuringTongue ${TAG}" --generate-notes --verify-tag
          fi

  pypi:
    name: PyPI (Trusted Publishing)
    needs: [build, github-release]
    if: >-
      always() && needs.github-release.result == 'success' &&
      vars.PYPI_PUBLISH == 'true' && (github.event_name == 'push' || inputs.publish_pypi)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/turingtongue
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish (Trusted Publishing, OIDC only)
        uses: pypa/gh-action-pypi-publish@v1.14.2
